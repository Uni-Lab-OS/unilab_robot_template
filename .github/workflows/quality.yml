name: robotics-quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install workspace
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e packages/unilab-robot-contracts
          python -m pip install -e packages/unilab-arm-cr7
          python -m pip install -e packages/unilab-arm-cr5
          python -m pip install -e packages/unilab-end-effector-sim
          python -m pip install -e packages/unilab-rail-linear
          python -m pip install -e packages/unilab-rail-mounted-arm
          python -m pip install -e packages/unilab-robot-runtime
          python -m pip install -e '.[test]'
      - name: Test contracts and integrations
        run: python -m pytest
      - name: Build every distribution
        run: |
          for package in packages/*; do
            python -m build "$package"
          done
