[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "unilab-robot-cloos"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["unilab-robot-contracts>=0.1,<0.2"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
unilab_robot_cloos = ["catalog.json", "models/**/*", "source_profiles/**/*"]
