[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unilab-robot-dobot"
version = "0.1.0"
description = "Uni-Lab dobot brand models and reviewed capability bindings"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "unilab-robot-contracts>=0.1,<0.2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["unilab_robot_dobot", "unilab_arm_cr5*", "unilab_arm_cr7*"]

[tool.setuptools.package-data]
unilab_robot_dobot = ["catalog.json", "models/**/*", "source_profiles/**/*"]
unilab_arm_cr5 = ["models/**/*"]
unilab_arm_cr7 = ["models/**/*"]
